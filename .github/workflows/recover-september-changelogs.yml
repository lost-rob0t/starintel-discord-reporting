name: Recover September changelog publishing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-september-changelogs.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the pre-fix regression runs
        uses: actions/github-script@v7
        with:
          script: |
            const obsoleteSha = 'd036521ee9710abfd7e665568a4f4cfa42d475fd';
            const allowedNames = new Set(['CI', 'Publish Discord catch-up']);
            const activeStatuses = new Set(['queued', 'pending', 'in_progress', 'waiting', 'requested']);
            const {data} = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo,
              head_sha: obsoleteSha,
              per_page: 100
            });
            for (const run of data.workflow_runs) {
              if (run.head_sha !== obsoleteSha || run.head_branch !== 'main') continue;
              if (!allowedNames.has(run.name) || !activeStatuses.has(run.status)) continue;
              core.info(`Cancelling obsolete pre-fix test run ${run.id} (${run.name})`);
              try {
                await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id});
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} already stopped`);
              }
            }
