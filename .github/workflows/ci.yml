name: CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'STYLE.md'
      - 'GPT-WORKFLOW.md'
      - 'README.md'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'STYLE.md'
      - 'GPT-WORKFLOW.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
