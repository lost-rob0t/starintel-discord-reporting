name: CI

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'scripts/**'
      - 'tests/**'
      - 'kb/**'
      - '.github/workflows/**'
      - 'STYLE.md'
      - 'GPT-WORKFLOW.md'
      - 'README.md'
  pull_request:
    paths:
      - 'reports/**'
      - 'scripts/**'
      - 'tests/**'
      - 'kb/**'
      - '.github/workflows/**'
      - 'STYLE.md'
      - 'GPT-WORKFLOW.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v

  prolog-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox
      - name: Test style expert system
        run: swipl -q -g run_tests -t halt tests/style_gate_tests.pl
      - name: Find changed reports
        id: reports
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          mapfile -t reports < <(git diff --name-only --diff-filter=ACMR "$base" "${{ github.sha }}" -- 'reports/**/*.md' 'reports/*.md')
          if ((${#reports[@]} == 0)); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\0' "${reports[@]}" > /tmp/changed-reports
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Enforce report tone
        if: steps.reports.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t reports < /tmp/changed-reports
          swipl -q -s scripts/style_gate.pl -g run_cli -- "${reports[@]}"
