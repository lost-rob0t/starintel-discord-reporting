name: Test Discord webhooks

on:
  push:
    branches: [main]
    paths:
      - 'reports/test/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send clearly marked test messages
        env:
          AUTO_DIG_FINDINGS: ${{ secrets.AUTO_DIG_FINDINGS }}
          FINDINGS_SHITPOSTS: ${{ secrets.FINDINGS_SHITPOSTS }}
          STARINTEL_UPDATES_CHANGELOG: ${{ secrets.STARINTEL_UPDATES_CHANGELOG }}
        run: |
          set -euo pipefail
          test -n "$AUTO_DIG_FINDINGS"
          test -n "$FINDINGS_SHITPOSTS"
          test -n "$STARINTEL_UPDATES_CHANGELOG"
          report="reports/test/webhook-test.md"
          python scripts/post_report.py --channel-name auto-dig-findings --webhook-url "$AUTO_DIG_FINDINGS" --report "$report" --state-file /tmp/test-state.json --force
          python scripts/post_report.py --channel-name findings-shitposts --webhook-url "$FINDINGS_SHITPOSTS" --report "$report" --state-file /tmp/test-state.json --force
          python scripts/post_report.py --channel-name starintel-updates-changelog --webhook-url "$STARINTEL_UPDATES_CHANGELOG" --report "$report" --state-file /tmp/test-state.json --force
