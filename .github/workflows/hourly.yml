name: Hourly Discord reports

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starintel-discord-reporting
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build relevant reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/hourly.py > /tmp/reports.tsv
      - name: Verify and publish only new reports
        env:
          AUTO_DIG_FINDINGS: ${{ secrets.AUTO_DIG_FINDINGS }}
          FINDINGS_SHITPOSTS: ${{ secrets.FINDINGS_SHITPOSTS }}
          STARINTEL_UPDATES_CHANGELOG: ${{ secrets.STARINTEL_UPDATES_CHANGELOG }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r channel kind report; do
            [ -n "${report:-}" ] || continue
            python scripts/verify_report.py "$report" --kind "$kind"
            case "$channel" in
              auto-dig-findings) webhook="$AUTO_DIG_FINDINGS" ;;
              findings-shitposts) webhook="$FINDINGS_SHITPOSTS" ;;
              starintel-updates-changelog) webhook="$STARINTEL_UPDATES_CHANGELOG" ;;
              *) echo "unknown channel: $channel" >&2; exit 1 ;;
            esac
            test -n "$webhook"
            python scripts/post_report.py \
              --channel-name "$channel" \
              --webhook-url "$webhook" \
              --report "$report" \
              --state-file state/published.json
            git config user.name "starintel-report-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "$report" state/published.json
            if ! git diff --cached --quiet; then
              git commit -m "report: publish $channel"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          done < /tmp/reports.tsv
      - name: Advance source cursors after successful publication
        run: |
          set -euo pipefail
          if [ -f state/source-state.pending.json ]; then
            mv state/source-state.pending.json state/source-state.json
            git config user.name "starintel-report-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/source-state.json
            if ! git diff --cached --quiet; then
              git commit -m "state: advance source cursors"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
