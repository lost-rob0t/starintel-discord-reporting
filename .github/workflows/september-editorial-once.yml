name: September requested editorial batch
on:
  push:
    branches: [main]
    paths: ['editorial/2026-09-17/READY.json']
permissions:
  contents: write
concurrency:
  group: starintel-discord-publisher
  cancel-in-progress: false
jobs:
  publish-reviewed-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate unchanged publisher and batch syntax
        run: |
          python -m py_compile scripts/*.py editorial/2026-09-17/publish.py
          python -m unittest discover -s tests -v
      - name: Review all articles before any delivery
        run: python editorial/2026-09-17/publish.py prepare
      - name: Persist reviewed article bodies
        run: python editorial/2026-09-17/publish.py commit
      - name: Deliver requested paired editions
        env:
          SHIPYARD_WEBHOOK: ${{ secrets.STARINTEL_UPDATES_CHANGELOG }}
        run: python editorial/2026-09-17/publish.py publish
      - name: Preserve verified receipts even after partial failure
        if: always()
        run: python editorial/2026-09-17/publish.py persist
      - name: Retain receipt recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: september-editorial-receipts
          path: |
            /tmp/shipyard-september-receipts.json
            /tmp/shipyard-september-plan.json
          if-no-files-found: ignore
